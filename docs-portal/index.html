<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DevXStream API Definition Specification documentation." />
    <title>DevXStream DADS Docs</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./branding.css" />
    <link rel="stylesheet" href="./client.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="API navigation">
        <a class="brand" href="#introduction" aria-label="DevXStream DADS documentation home">
          <img src="./assets/devxstream-logo.png" alt="DevXStream — Streamline Development. Accelerate Innovation." />
        </a>
        <label class="search"><span>Search</span><input id="search" type="search" placeholder="Find endpoints or models" /></label>
        <nav id="navigation" aria-label="Documentation sections"></nav>
        <footer class="dads-powered-by">
          <img src="./assets/dads-logo.png" alt="DADS" />
          <span><strong>DADS</strong><a href="https://devxstream.com" target="_blank" rel="noopener noreferrer" aria-label="Visit DevXStream"><small>Powered by DevXStream</small></a></span>
        </footer>
      </aside>

      <main id="content" tabindex="-1">
        <header class="topbar">
          <div><span class="eyebrow">API REFERENCE</span><h1 id="api-title">Loading…</h1></div>
          <div class="topbar-actions">
            <button id="authorize" class="button button-secondary" type="button">Authorize</button>
            <button id="theme-toggle" type="button" aria-label="Toggle colour theme">◐</button>
            <a id="download-definition" class="button button-secondary" download>Download DADS</a>
            <button id="download-openapi" class="button" type="button">Download OpenAPI</button>
          </div>
        </header>
        <section id="document-content" aria-live="polite"></section>
      </main>
    </div>
    <template id="operation-template">
      <article class="operation">
        <div class="operation-heading"><span class="method"></span><code class="route"></code></div>
        <h2></h2><p class="description"></p>
        <section class="details"></section>
        <section class="request-example"><div class="section-title">Request example</div><pre><code></code></pre><button class="copy" type="button">Copy</button></section>
        <section class="responses"><div class="section-title">Responses</div></section>
        <details class="engineering"><summary>DevXStream engineering details</summary><dl></dl></details>
      </article>
    </template>
    <dialog id="auth-dialog" class="auth-dialog">
      <form method="dialog">
        <header><h2>Authorization</h2><button value="cancel" class="icon-button" aria-label="Close authorization dialog">×</button></header>
        <p>Credentials are kept only in this browser session and are sent only when you use <strong>Send request</strong>.</p>
        <div id="auth-fields"></div>
        <footer><button id="clear-auth" class="button-secondary" type="button">Clear credentials</button><button value="default">Done</button></footer>
      </form>
    </dialog>
    <dialog id="request-dialog" class="request-dialog">
      <header class="request-dialog-header"><div class="request-address"><span id="request-method" class="method"></span><input id="request-url" aria-label="Request URL" spellcheck="false" /></div><div class="request-actions"><button id="send-modal-request" type="button">▶ Send</button><button id="cancel-modal-request" class="button-secondary" type="button" disabled>Cancel</button><form method="dialog"><button class="icon-button" aria-label="Close request dialog">×</button></form></div></header>
      <div class="request-dialog-grid">
        <section class="request-editor"><div class="client-section"><h3>Headers</h3><div id="request-headers" class="key-value-table"></div><button class="add-row" data-add-row="header" type="button">+ Add header</button></div><div class="client-section"><h3>Cookies</h3><div id="request-cookies" class="key-value-table"></div><button class="add-row" data-add-row="cookie" type="button">+ Add cookie</button></div><div class="client-section"><h3>Query parameters</h3><div id="request-query" class="key-value-table"></div><button class="add-row" data-add-row="query" type="button">+ Add parameter</button></div><div class="client-section"><h3>Request body</h3><label class="body-type">Content type <select id="request-content-type"><option value="none">None</option><option value="application/json">JSON</option><option value="application/x-www-form-urlencoded">Form URL encoded</option><option value="multipart/form-data">Multipart form</option><option value="text/plain">Plain text</option><option value="application/xml">XML</option></select></label><textarea id="request-body" spellcheck="false"></textarea><div id="multipart-fields" class="multipart-fields" hidden><div id="request-multipart" class="key-value-table"></div><button class="add-row" data-add-row="multipart" type="button">+ Add form field</button><label class="file-field">Attach file <input id="request-file" type="file" /></label></div></div><details class="client-history"><summary>Request history</summary><div id="request-history"></div></details></section>
        <section class="request-result"><div class="client-toolbar"><label>Code sample <select id="request-language"><option value="curl">cURL</option><option value="javascript">JavaScript fetch</option><option value="node">Node.js fetch</option><option value="csharp">C# HttpClient</option><option value="python">Python httpx</option><option value="java">Java HttpClient</option></select></label><button id="copy-modal-code" class="copy-dialog" type="button">Copy code</button></div><pre class="code-sample"><code id="request-code"></code></pre><section class="live-response"><div class="response-toolbar"><strong>Response</strong><span id="request-response-status">Ready to send a request.</span><button id="copy-response" class="copy-response" type="button" aria-label="Copy response" title="Copy response">⧉</button></div><div class="response-tabs"><button data-response-mode="preview" class="active" type="button">Preview</button><button data-response-mode="raw" type="button">Raw</button><button data-response-mode="headers" type="button">Headers</button></div><pre class="response-body"><code id="request-response-body"></code></pre></section></section>
      </div>
    </dialog>
    <script src="./app.js"></script>
  </body>
</html>
