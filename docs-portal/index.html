<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DevXStream API Definition Specification documentation." />
    <title>DevXStream DADS Docs</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./branding.css" />
    <link rel="stylesheet" href="./client.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="API navigation">
        <a class="brand" href="#introduction" aria-label="DevXStream DADS documentation home">
          <img src="./assets/devxstream-logo.png" alt="DevXStream — Streamline Development. Accelerate Innovation." />
        </a>
        <label class="search"><span>Search</span><input id="search" type="search" placeholder="Find endpoints or models" /></label>
        <nav id="navigation" aria-label="Documentation sections"></nav>
        <footer>Built from <strong>DADS v1</strong></footer>
      </aside>

      <main id="content" tabindex="-1">
        <header class="topbar">
          <div><span class="eyebrow">API REFERENCE</span><h1 id="api-title">Loading…</h1></div>
          <div class="topbar-actions">
            <button id="authorize" class="button button-secondary" type="button">Authorize</button>
            <button id="theme-toggle" type="button" aria-label="Toggle colour theme">◐</button>
            <a id="download-definition" class="button button-secondary" download>Download DADS</a>
            <button id="download-openapi" class="button" type="button">Download OpenAPI</button>
          </div>
        </header>
        <section id="document-content" aria-live="polite"></section>
      </main>
    </div>
    <template id="operation-template">
      <article class="operation">
        <div class="operation-heading"><span class="method"></span><code class="route"></code></div>
        <h2></h2><p class="description"></p>
        <section class="details"></section>
        <section class="request-example"><div class="section-title">Request example</div><pre><code></code></pre><button class="copy" type="button">Copy</button></section>
        <section class="responses"><div class="section-title">Responses</div></section>
        <details class="engineering"><summary>DevXStream engineering details</summary><dl></dl></details>
      </article>
    </template>
    <dialog id="auth-dialog" class="auth-dialog">
      <form method="dialog">
        <header><h2>Authorization</h2><button value="cancel" class="icon-button" aria-label="Close authorization dialog">×</button></header>
        <p>Credentials are kept only in this browser session and are sent only when you use <strong>Send request</strong>.</p>
        <div id="auth-fields"></div>
        <footer><button id="clear-auth" class="button-secondary" type="button">Clear credentials</button><button value="default">Done</button></footer>
      </form>
    </dialog>
    <dialog id="request-dialog" class="request-dialog">
      <header class="request-dialog-header"><div><div class="operation-heading"><span id="request-method" class="method"></span><code id="request-route" class="route"></code></div><h2 id="request-dialog-title"></h2></div><form method="dialog"><button class="icon-button" aria-label="Close request dialog">×</button></form></header>
      <div class="request-url"><span>Request URL</span><code id="request-url"></code></div>
      <div class="request-dialog-grid">
        <form id="request-form" class="request-editor"></form>
        <section class="request-result"><div class="client-toolbar"><label>Code sample <select id="request-language"><option value="curl">cURL</option><option value="javascript">JavaScript fetch</option><option value="csharp">C# HttpClient</option><option value="python">Python httpx</option></select></label><button id="send-modal-request" type="button">▶ Send request</button></div><pre class="code-sample"><code id="request-code"></code></pre><button id="copy-modal-code" class="copy-dialog" type="button">Copy code</button><section class="live-response"><div class="section-title">Response</div><div id="request-response-status" class="response-status"></div><details open class="response-headers"><summary>Response headers</summary><pre><code id="request-response-headers"></code></pre></details><pre class="response-body"><code id="request-response-body"></code></pre></section></section>
      </div>
    </dialog>
    <script src="./app.js"></script>
  </body>
</html>
